  bindEvents() {
    const sb = document.getElementById('edit-sidebar');

    // 折叠
    sb.querySelectorAll('.section-header').forEach(h => {
      h.addEventListener('click', () => {
        h.parentElement.classList.toggle('collapsed');
      });
    });

    // 滑块
    sb.querySelectorAll('input[type="range"]').forEach(input => {
      input.addEventListener('input', (e) => {
        const key = e.target.dataset.key;
        let val = parseInt(e.target.value);
        if (e.target.dataset.multiply) val = val * parseInt(e.target.dataset.multiply);
        if (e.target.dataset.divide) val = val / parseInt(e.target.dataset.divide);
        this.setConfig(key, val);
        // 更新显示
        const disp = sb.querySelector(`[data-display="${key}"]`);
        if (disp) {
          if (key === 'prey.size') disp.textContent = val + 'px';
          else if (key === 'effect.duration') disp.textContent = val + 'ms';
          else if (key === 'game.restInterval') disp.textContent = Math.round(val / 60) + 'min';
          else if (key === 'game.musicVolume') disp.textContent = Math.round(val * 100) + '%';
          else disp.textContent = val;
        }
        // 实时调整音乐音量
        if (key === 'game.musicVolume') Audio.setMusicVolume(val);
        previewInstance?.update();
      });
    });

    // 颜色选择器
    sb.querySelectorAll('input[type="color"]').forEach(input => {
      input.addEventListener('input', (e) => {
        this.setConfig(e.target.dataset.key, e.target.value);
        // 同步色板
        const swatchContainer = e.target.previousElementSibling;
        if (swatchContainer && swatchContainer.classList.contains('color-swatches')) {
          swatchContainer.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        }
        previewInstance?.update();
      });
    });

    // 色板
    sb.querySelectorAll('[data-swatches]').forEach(container => {
      const key = container.dataset.swatches;
      container.querySelectorAll('.swatch').forEach(s => {
        s.addEventListener('click', () => {
          container.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
          s.classList.add('active');
          this.setConfig(key, s.dataset.color);
          // 同步颜色选择器
          const colorInput = container.nextElementSibling;
          if (colorInput && colorInput.type === 'color') colorInput.value = s.dataset.color;
          previewInstance?.update();
        });
      });
    });

    // 下拉选择
    sb.querySelectorAll('select').forEach(sel => {
      sel.addEventListener('change', (e) => {
        this.setConfig(e.target.dataset.key, e.target.value);
        previewInstance?.update();
      });
    });

    // 单选组
    sb.querySelectorAll('[data-radio]').forEach(item => {
      item.addEventListener('click', () => {
        const key = item.dataset.radio;
        const group = item.parentElement;
        group.querySelectorAll('.radio-item').forEach(x => x.classList.remove('active'));
        item.classList.add('active');
        this.setConfig(key, item.dataset.value);
        previewInstance?.update();
      });
    });

    // 开关
    sb.querySelectorAll('[data-toggle]').forEach(t => {
      t.addEventListener('click', () => {
        t.classList.toggle('on');
        this.setConfig(t.dataset.toggle, t.classList.contains('on'));
        // 关联行
        if (t.dataset.toggle === 'background.gradient') {
          sb.querySelectorAll('.bg-grad-row').forEach(r => {
            r.style.opacity = t.classList.contains('on') ? '1' : '0.4';
            r.style.pointerEvents = t.classList.contains('on') ? 'auto' : 'none';
          });
        }
        if (t.dataset.toggle === 'game.restReminder') {
          const row = sb.querySelector('.rest-interval-row');
          if (row) {
            row.style.opacity = t.classList.contains('on') ? '1' : '0.4';
            row.style.pointerEvents = t.classList.contains('on') ? 'auto' : 'none';
          }
        }
        if (t.dataset.toggle === 'game.musicEnabled') {
          const row = sb.querySelector('.music-vol-row');
          if (row) {
            row.style.opacity = t.classList.contains('on') ? '1' : '0.4';
            row.style.pointerEvents = t.classList.contains('on') ? 'auto' : 'none';
          }
        }
        previewInstance?.update();
      });
    });

    // 主题预设
    sb.querySelectorAll('[data-theme]').forEach(btn => {
      btn.addEventListener('click', () => {
        const themeKey = btn.dataset.theme;
        sb.querySelectorAll('[data-theme]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (themeKey !== 'custom' && THEMES[themeKey]) {
          this.applyTheme(themeKey);
        }
      });
    });

    // 文件上传
    const uploadArea = document.getElementById('upload-area');
    const fileInput = document.getElementById('file-input');
    if (uploadArea && fileInput) {
      uploadArea.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => this.handleFileUpload(e));
    }
  },

  handleFileUpload(e) {
    const files = e.target.files;
    if (!files || files.length === 0) return;

    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;
      if (file.size > 500 * 1024) {
        // 压缩大图
        this.compressImage(file, (dataUrl) => {
          config.prey.customImages.push(dataUrl);
          this.renderUploadPreview();
          previewInstance?.update();
        });
      } else {
        const reader = new FileReader();
        reader.onload = (ev) => {
          config.prey.customImages.push(ev.target.result);
          this.renderUploadPreview();
          previewInstance?.update();
        };
        reader.readAsDataURL(file);
      }
    }
  },

  compressImage(file, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxDim = 200;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          const ratio = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * ratio); h = Math.round(h * ratio);
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/png'));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  },

  renderUploadPreview() {
    const container = document.getElementById('upload-preview');
    if (!container) return;
    container.innerHTML = '';
    config.prey.customImages.forEach((src, i) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'upload-thumb-wrapper';
      const img = document.createElement('img');
      img.className = 'upload-thumb';
      img.src = src;
      const removeBtn = document.createElement('button');
      removeBtn.className = 'upload-thumb-remove';
      removeBtn.textContent = 'x';
      removeBtn.onclick = (e) => {
        e.stopPropagation();
        config.prey.customImages.splice(i, 1);
        this.renderUploadPreview();
        previewInstance?.update();
      };
      wrapper.appendChild(img);
      wrapper.appendChild(removeBtn);
      container.appendChild(wrapper);
    });
  },

  setConfig(key, value) {
    const parts = key.split('.');
    let obj = config;
    for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
    obj[parts[parts.length - 1]] = value;
    saveConfig();
    // 切换到自定义主题
    localStorage.setItem('catchase-theme', 'custom');
    // 如果改的是背景色，同步根元素
    if (key.startsWith('background.')) updateRootBg();
  },

  applyTheme(themeKey) {
    const theme = THEMES[themeKey];
    if (!theme) return;
    // 合并主题（保留自定义图片和游戏规则）
    const customImgs = config.prey.customImages;
    if (theme.prey) Object.assign(config.prey, theme.prey);
    if (theme.background) Object.assign(config.background, theme.background);
    if (theme.effect) Object.assign(config.effect, theme.effect);
    config.prey.customImages = customImgs;
    saveConfig();
    localStorage.setItem('catchase-theme', themeKey);
    updateRootBg();
    // 重新渲染面板
    this.renderSidebar();
    this.bindEvents();
    previewInstance?.update();
  },

  resetDefaults() {
    if (!confirm('确定要重置所有设置到默认值吗？')) return;
    config = JSON.parse(JSON.stringify(DEFAULTS));
    localStorage.removeItem('catchase-theme');
    saveConfig();
    updateRootBg();
    this.renderSidebar();
    this.bindEvents();
    previewInstance?.update();
  },

  saveAndPlay() {
    saveConfig();
    if (this._returnToGame) {
      this._returnToGame = false;
      UI.showScreen('game', { fromEdit: true });
    } else {
      UI.showScreen('game');
    }
  },

  goBack() {
    if (this._returnToGame) {
      this._returnToGame = false;
      saveConfig();
      UI.showScreen('game', { fromEdit: true });
    } else {
      UI.showScreen('menu');
    }
  }
};

// ============================================================
//  预览引擎
// ============================================================
class PreviewEngine {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.prey = null;
    this.particles = [];
    this.running = false;
    this.lastTime = 0;
    this.resize();

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      if (this.prey && this.prey.hitTest(x, y)) {
        this.spawnEffect(this.prey.x, this.prey.y);
        Audio.playPreySound(this.prey.movement);
      }
    });
  }

  resize() {
    const parent = this.canvas.parentElement;
    const pW = parent.clientWidth - 40;
    const pH = parent.clientHeight - 40;
    const aspect = 16 / 10;
    let w, h;
    if (pW / pH > aspect) { h = Math.min(pH, 500); w = h * aspect; }
    else { w = Math.min(pW, 800); h = w / aspect; }
    this.canvas.width = w;
    this.canvas.height = h;
  }

  start() {
    this.running = true;
    this.spawnPrey();
    this.lastTime = performance.now();
    requestAnimationFrame((t) => this.loop(t));
  }

  spawnPrey() {
    this.prey = new Prey(this.canvas.width, this.canvas.height);
  }

  update() {
    // 参数变更时重新生成猎物以应用新属性
    this.spawnPrey();
  }

  loop(now) {
    if (!this.running) return;
    const dt = Math.min(now - this.lastTime, 50);
    this.lastTime = now;

    if (this.prey) this.prey.update(dt);
    this.particles = this.particles.filter(p => { p.update(); return p.life > 0; });

    this.draw();
    requestAnimationFrame((t) => this.loop(t));
  }

  draw() {
    const ctx = this.ctx;
    const w = this.canvas.width, h = this.canvas.height;

    // 背景
    const bg = config.background;
    if (bg.gradient) {
      let grad;
      if (bg.gradientDirection === 'vertical') grad = ctx.createLinearGradient(0, 0, 0, h);
      else if (bg.gradientDirection === 'horizontal') grad = ctx.createLinearGradient(0, 0, w, 0);
      else grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, bg.color);
      grad.addColorStop(1, bg.gradientColor);
      ctx.fillStyle = grad;
    } else {
      ctx.fillStyle = bg.color;
    }
    ctx.fillRect(0, 0, w, h);

    if (this.prey) this.prey.draw(ctx);
    for (const p of this.particles) p.draw(ctx);

    // 提示文字
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('点击猎物测试特效', w / 2, h - 16);
  }

  spawnEffect(x, y) {
    const count = config.effect.intensity;
    const color = config.effect.color;
    const type = config.effect.type;
    for (let i = 0; i < count; i++) {
      this.particles.push(new Particle(x, y, color, type));
    }
  }
}

// ============================================================
//  首页背景动画 —— 星河粒子网络 + 流星 + 猫爪涟漪
// ============================================================
const MenuBg = {
  canvas: null, ctx: null,
  particles: [], paws: [], meteors: [],
  mouseX: -9999, mouseY: -9999,
  meteorTimer: 0, pawTimer: 0,
  running: false,

  init() {
    this.canvas = document.getElementById('menu-bg-canvas');
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('mousemove', (e) => { this.mouseX = e.clientX; this.mouseY = e.clientY; });
    window.addEventListener('touchmove', (e) => {
      if (e.touches[0]) { this.mouseX = e.touches[0].clientX; this.mouseY = e.touches[0].clientY; }
    }, { passive: true });

    this.particles = [];
    for (let i = 0; i < 40; i++) this.particles.push(this._spawnParticle());
  },

  resize() {
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = window.innerWidth * dpr;
    this.canvas.height = window.innerHeight * dpr;
    this.canvas.style.width = window.innerWidth + 'px';
    this.canvas.style.height = window.innerHeight + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  },

  // --- 星河粒子 ---
  _spawnParticle() {
    const colors = [
      { r: 255, g: 165, b: 0 },
      { r: 255, g: 107, b: 107 },
      { r: 255, g: 215, b: 0 },
      { r: 79,  g: 195, b: 247 },
    ];
    const c = colors[Math.floor(Math.random() * colors.length)];
    return {
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5 - 0.1,
      r: 1 + Math.random() * 2.5,
      a: 0.15 + Math.random() * 0.45,
      cr: c.r, cg: c.g, cb: c.b,
      phase: Math.random() * Math.PI * 2,
    };
  },

  // --- 猫爪涟漪 ---
  _spawnPaw() {
    const w = window.innerWidth, h = window.innerHeight;
    return {
      x: 60 + Math.random() * (w - 120),
      y: 60 + Math.random() * (h - 120),
      life: 0,
      maxLife: 80 + Math.random() * 40,
      rot: (Math.random() - 0.5) * 60,
    };
  },

  // --- 流星 ---
  _spawnMeteor() {
    const w = window.innerWidth;
    const startX = Math.random() * w * 0.6;
    const angle = Math.PI * 0.25 + (Math.random() - 0.5) * 0.3;
    const speed = 6 + Math.random() * 4;
    return {
      x: startX,
      y: -20,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0,
      maxLife: 60 + Math.random() * 30,
      length: 80 + Math.random() * 60,
    };
  },

  start() {
    if (this.running) return;
    this.running = true;
    this._loop();
  },

  stop() { this.running = false; },

  _loop() {
    if (!this.running) return;
    const ctx = this.ctx;
    const w = window.innerWidth, h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    // ===== 1. 粒子 + 连线网络 =====
    for (const p of this.particles) {
      p.phase += 0.02;
      // 鼠标引力
      const dx = this.mouseX - p.x;
      const dy = this.mouseY - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        const force = (1 - dist / 150) * 0.04;
        p.vx += (dx / (dist + 1)) * force;
        p.vy += (dy / (dist + 1)) * force;
      }
      // 速度阻尼
      p.vx *= 0.97;
      p.vy *= 0.97;
      // 最低漂移
      if (Math.abs(p.vx) < 0.05) p.vx += (Math.random() - 0.5) * 0.1;
      if (Math.abs(p.vy) < 0.05) p.vy += (Math.random() - 0.5) * 0.1;
      p.x += p.vx + Math.sin(p.phase) * 0.15;
      p.y += p.vy;
      // 边界循环
      if (p.x < -10) p.x = w + 10;
      if (p.x > w + 10) p.x = -10;
      if (p.y < -10) p.y = h + 10;
      if (p.y > h + 10) p.y = -10;
    }

    // 粒子间连线
    for (let i = 0; i < this.particles.length; i++) {
      for (let j = i + 1; j < this.particles.length; j++) {
        const a = this.particles[i], b = this.particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 120) {
          const alpha = (1 - d / 120) * 0.25;
          ctx.strokeStyle = 'rgba(' + a.cr + ',' + a.cg + ',' + a.cb + ',' + alpha + ')';
          ctx.lineWidth = (1 - d / 120) * 1.2;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    // 粒子本体
    for (const p of this.particles) {
      const flicker = 0.7 + Math.sin(p.phase * 2) * 0.3;
      const alpha = p.a * flicker;
      ctx.fillStyle = 'rgba(' + p.cr + ',' + p.cg + ',' + p.cb + ',' + alpha + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // ===== 2. 流星 =====
    this.meteorTimer++;
    if (this.meteorTimer > 180 + Math.random() * 120) {
      this.meteors.push(this._spawnMeteor());
      this.meteorTimer = 0;
    }
    for (let i = this.meteors.length - 1; i >= 0; i--) {
      const m = this.meteors[i];
      m.x += m.vx;
      m.y += m.vy;
      m.life++;
      const lifeRatio = m.life / m.maxLife;
      const fade = lifeRatio < 0.3 ? lifeRatio / 0.3 : (1 - (lifeRatio - 0.3) / 0.7);
      // 拖尾
      const tailX = m.x - m.vx * m.length / 8;
      const tailY = m.y - m.vy * m.length / 8;
      const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
      grad.addColorStop(0, 'rgba(255,255,255,' + (0.6 * fade) + ')');
      grad.addColorStop(0.3, 'rgba(255,200,100,' + (0.3 * fade) + ')');
      grad.addColorStop(1, 'rgba(255,200,100,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();
      // 头部光点
      ctx.fillStyle = 'rgba(255,255,255,' + (0.8 * fade) + ')';
      ctx.beginPath();
      ctx.arc(m.x, m.y, 2, 0, Math.PI * 2);
      ctx.fill();
      if (m.life >= m.maxLife || m.x > w + 50 || m.y > h + 50) {
        this.meteors.splice(i, 1);
      }
    }

    // ===== 3. 猫爪涟漪 =====
    this.pawTimer++;
    if (this.pawTimer > 120 + Math.random() * 100) {
      this.paws.push(this._spawnPaw());
      this.pawTimer = 0;
    }
    for (let i = this.paws.length - 1; i >= 0; i--) {
      const p = this.paws[i];
      p.life++;
      const ratio = p.life / p.maxLife;
      if (ratio >= 1) { this.paws.splice(i, 1); continue; }
      // 淡入快，淡出慢
      let alpha;
      if (ratio < 0.2) alpha = (ratio / 0.2) * 0.15;
      else alpha = (1 - (ratio - 0.2) / 0.8) * 0.15;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#FFA500';
      // 简化猫爪：掌心椭圆 + 4个趾
      ctx.beginPath();
      ctx.ellipse(0, 4, 7, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      for (let a = -1; a <= 1; a++) {
        ctx.beginPath();
        ctx.ellipse(a * 4, -4, 2.2, 3, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.ellipse(0, -6, 1.8, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(() => this._loop());
  }
};

// ============================================================
//  首页猎物预览
// ============================================================
const MenuPreyPreview = {
  preyTypes: [
    { movement: 'sine',      color: '#FFA500', name: '小鱼' },
    { movement: 'dart',      color: '#FF1744', name: '激光' },
    { movement: 'wander',    color: '#8BC34A', name: '小虫' },
    { movement: 'fall',      color: '#FFFFFF', name: '羽毛' },
    { movement: 'frog',      color: '#4CAF50', name: '青蛙' },
    { movement: 'butterfly', color: '#E040FB', name: '蝴蝶' },
    { movement: 'spider',    color: '#9E9E9E', name: '蜘蛛' },
    { movement: 'cricket',   color: '#CDDC39', name: '蟋蟀' },
  ],

  render() {
    const container = document.getElementById('prey-preview');
    if (!container) return;
    container.innerHTML = '';

    // 当前选中的类型（从 config 读取）
    const currentMovement = config.prey.movement;
    const currentColor = config.prey.color;

    this.preyTypes.forEach((pt, i) => {
      const isSelected = pt.movement === currentMovement;
      const chip = document.createElement('div');
      chip.className = 'prey-chip' + (isSelected ? ' selected' : '');
      chip.dataset.movement = pt.movement;
      chip.dataset.color = pt.color;

      // 勾选标记
      const check = document.createElement('div');
      check.className = 'check-mark';
      check.textContent = '\u2713';

      const canvas = document.createElement('canvas');
      canvas.width = 56; canvas.height = 56;
      const ctx = canvas.getContext('2d');

      // 临时构造一个 prey 来绘制
      const savedConfig = JSON.parse(JSON.stringify(config));
      config.prey.movement = pt.movement;
      config.prey.color = pt.color;
      config.prey.size = 26;
      const prey = new Prey(56, 56);
      prey.x = 28; prey.y = 28;
      prey.tailPhase = 0.5;
      prey.draw(ctx);
      config = savedConfig;

      const name = document.createElement('div');
      name.className = 'prey-name';
      name.textContent = pt.name;

      chip.appendChild(check);
      chip.appendChild(canvas);
      chip.appendChild(name);

      // 点击选中
      chip.addEventListener('click', () => this.select(pt));

      container.appendChild(chip);

      // 瀑布式入场：每张延迟 60ms
      setTimeout(() => chip.classList.add('prey-chip-in'), i * 60);
    });
  },

  select(pt) {
    // 更新 config
    config.prey.movement = pt.movement;
    config.prey.color = pt.color;
    // 保存到 localStorage
    saveConfig();
    // 更新 UI：清除所有选中态，标记当前
    const chips = document.querySelectorAll('.prey-chip');
    chips.forEach(c => {
      if (c.dataset.movement === pt.movement) {
        c.classList.add('selected');
      } else {
        c.classList.remove('selected');
      }
    });
  }
};

  }, { passive: false });

      logoClickCount++;

        void menu.offsetWidth;
        menu.classList.add('rainbow-mode');
        setTimeout(() => menu.classList.remove('rainbow-mode'), 3000);
      }
    });
  }
});
